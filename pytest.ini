[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage on every run (settings in .coveragerc). Reports land in coverage/:
# python-html/index.html to browse, python.lcov for CI/Codecov.
markers =
    browser: real-browser (Playwright) tests under tests/browser/; skip with -m "not browser"
    allow_page_errors: browser test expects JS/network errors (skips the page-error guard)
addopts = --cov --cov-report=term:skip-covered --cov-report=html --cov-report=lcov
