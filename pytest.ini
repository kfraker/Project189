[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage on every run (settings in .coveragerc). Reports land in coverage/:
# python-html/index.html to browse, python.lcov for CI/Codecov.
addopts = --cov --cov-report=term:skip-covered --cov-report=html --cov-report=lcov
