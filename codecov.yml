# Codecov settings. Python coverage arrives with flag "python"; page-code (JavaScript)
# coverage will arrive with flag "javascript" once browser tests measure it (Epic T4).
coverage:
  status:
    project:
      default:
        informational: true   # report the number, don't fail builds (a coverage guard comes in T5.5)
    patch:
      default:
        informational: true

flags:
  python:
    paths:
      - app.py
      - db_migrations/
    carryforward: true

comment:
  layout: "header, diff, flags, files"
