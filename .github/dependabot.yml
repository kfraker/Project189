# Weekly update checks, grouped so each area opens one pull request. They target dev,
# so updates go through the full test suite before reaching a release.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pyee    # Playwright requires its own version of this
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tools/coverage
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      coverage-tools:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tools/lint
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      lint-tools:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
