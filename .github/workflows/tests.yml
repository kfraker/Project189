# Runs the full test suite (with coverage) on every push and pull request.
# Uses a throwaway Postgres container — never Neon, never real data.
name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sweat
          POSTGRES_PASSWORD: sweat
          POSTGRES_DB: sweat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sweat:sweat@localhost:5432/sweat_test
      # Dummy values — app.py requires these at import; tests never call Google.
      FLASK_SECRET_KEY: ci-only-not-a-secret
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/coverage/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci --prefix tools/coverage

      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium

      - name: Run tests with coverage (API + browser)
        run: python -m pytest --tracing=retain-on-failure --screenshot=only-on-failure --output=test-results

      - name: Coverage report + guard (fails if coverage dropped below tools/coverage/baseline.json)
        run: npm --prefix tools/coverage run check

      - name: Upload Python coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/python.lcov
          flags: python
          fail_ci_if_error: true

      - name: Upload page-code coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/js.lcov
          flags: javascript
          fail_ci_if_error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Upload browser-test failure evidence (screenshots + traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: test-results/
          if-no-files-found: ignore
